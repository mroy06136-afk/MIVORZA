name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Accept Android SDK licenses
      run: |
        mkdir -p $ANDROID_SDK_ROOT/licenses
        echo -e "\n8933bac1632f81480f07d25fb2f440eb54514da1" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
        echo -e "\n24333f1a63bf6609358a599602a5c4e9cfbbd0e4" >> $ANDROID_SDK_ROOT/licenses/android-sdk-license
        echo -e "\nd56f5187479451eabf01fb78af6dfcb131a648b0" >> $ANDROID_SDK_ROOT/licenses/android-sdk-license

    - name: Build APK with Gradle
      run: ./gradlew assembleDebug
