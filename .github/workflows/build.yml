name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check repository files
        run: ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Check for gradle or build files
        run: find . -maxdepth 2 -name "gradlew" -o -name "build.gradle"

      - name: Build with Gradle (if gradlew exists)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            find . -name "gradlew" -exec chmod +x {} \;
            find . -name "gradlew" -exec {} assembleDebug \;
          else
            find . -name "gradlew" -execdir ./gradlew assembleDebug \;
            echo "No gradlew found, skipping gradle build!"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
            /**/*.apk
            !**/build/intermediates/**
          if-no-files-found: warn
